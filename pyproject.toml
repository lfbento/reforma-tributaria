[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reforma-tributaria"
version = "0.1.0"
description = "Agente analisador de pedidos e contratos - Reforma Tributaria 2027 (EC 132/2023, LC 214/2025)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "Pillow>=10.0",
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
office = ["markitdown>=0.1"]
docling = ["docling>=2.0"]
mpp = ["jpype1>=1.5"]
full = [
    "markitdown>=0.1",
    "docling>=2.0",
    "jpype1>=1.5",
]
dev = ["pytest>=8"]

[project.scripts]
reforma-tributaria = "reforma_tributaria.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reforma_tributaria = ["premises.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"